<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ring Ring Daily Command Center</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='50%25' y='58' font-size='54' text-anchor='middle'%3E%F0%9F%93%9E%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", Inter, Helvetica Neue, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            background: #fafafa;
            color: #0a0a0a;
            font-size: 13px;
            line-height: 1.5;
        }

        /* TOP BAR */
        /* Brand accent stripe at very top */
        body::before { content:''; position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, #2D8B28 0%, #2D8B28 40%, #FFD710 40%, #FFD710 80%, #D40000 80%, #D40000 100%); z-index:9999; pointer-events:none; }
        .top-bar { background: #fff; border-bottom: 1px solid #eceef0; padding: 8px 20px 7px; display: flex; justify-content: space-between; align-items: center; }
        .top-bar-left h1 { font-size: 14px; font-weight: 700; color: #0a0a0a; margin: 0 0 1px; letter-spacing: -0.2px; }
        .top-bar-left h1 span { color: #0a0a0a; }
        .top-bar-left .meta { font-size: 11px; color: #6b7280; letter-spacing: 0.1px; }
        .top-bar-left .meta strong { color: #0a0a0a; font-weight: 600; }
        .top-bar-right { display: flex; align-items: center; gap: 14px; }
        .last-updated { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: #6b7280; font-weight: 600; letter-spacing: 0.2px; }
        .last-updated .lu-dot { width: 6px; height: 6px; border-radius: 50%; background: #2D8B28; }
        .last-updated strong { color: #0a0a0a; font-weight: 600; }
        .top-link { display: inline-block; padding: 5px 11px; border-radius: 4px; font-size: 10px; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 0.6px; transition: background 0.15s; }
        .scorecard-link { background: #0a0a0a; color: #fff; }
        .scorecard-link:hover { background: #1a1a1a; }

        /* SUMMARY STRIP — merged with focus into single meta strip */
        .meta-strip { background: #fff; border-bottom: 1px solid #eceef0; padding: 6px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        .ms-divider { width: 1px; height: 18px; background: #e5e7eb; }
        .ms-focus { display: flex; align-items: center; gap: 12px; }
        .ms-stats { display: flex; gap: 18px; }
        .ms-stat { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; display: inline-flex; align-items: baseline; gap: 5px; }
        .ms-stat strong { color: #0a0a0a; font-size: 14px; font-weight: 800; letter-spacing: -0.3px; text-transform: none; }
        .summary-strip { display: none; }
        .num-green { color: #2D8B28; }
        .num-red { color: #D40000; }
        .num-amber { color: #0a0a0a; }

        /* TAB NAV */
        .tab-nav {
            background: #fff;
            border-bottom: 1px solid #eceef0;
            padding: 0 16px;
            display: flex;
            gap: 2px;
        }

        .tab-btn {
            padding: 9px 14px 8px; font-size: 12px; font-weight: 600; color: #6b7280;
            cursor: pointer; border: none; background: none;
            border-bottom: 2px solid transparent; font-family: inherit;
            transition: color 0.15s ease, border-color 0.15s ease;
            letter-spacing: 0.1px;
        }

        .tab-btn:hover { color: #0a0a0a; }
        .tab-btn.active { color: #0a0a0a; border-bottom-color: #2D8B28; font-weight: 800; }

        /* MAIN */
        .main { padding: 12px 16px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* REGION SECTIONS */
        .region-section { margin-bottom: 14px; }

        .region-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0 6px; border-bottom: 1px solid #e5e5e5;
        }
        .region-west-hdr, .region-east-hdr { background: transparent; }
        .region-header h3 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; }
        .region-west-hdr h3, .region-east-hdr h3 { color: #6b7280; }

        .region-summary { display: flex; gap: 12px; font-size: 11px; color: #6b7280; }
        .region-summary strong { color: #374151; }

        /* TABLE */
        .stores-table {
            width: 100%; border-collapse: collapse; background: #fff;
            border: 1px solid #fafafa; border-top: none;
            border-radius: 0 0 6px 6px; overflow: hidden;
        }

        .stores-table th {
            background: #fafafa; padding: 5px 6px; text-align: center;
            font-weight: 700; font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.4px; color: #6b7280;
            border-bottom: 2px solid #fafafa; white-space: nowrap;
        }

        .stores-table th.left { text-align: left; }
        .stores-table th.sortable { cursor: pointer; user-select: none; }
        .stores-table th.sortable:hover { background: #fafafa; }
        .sort-arrow { font-size: 8px; margin-left: 2px; color: #9ca3af; }
        .sort-arrow.active { color: #0a0a0a; }

        .stores-table th.ib-start, .stores-table td.ib-start { border-left: 1px solid #e5e5e5; }
        .stores-table th.ob-start, .stores-table td.ob-start { border-left: 1px solid #e5e5e5; }
        .stores-table th.ov-col, .stores-table td.ov-col { border-left: 1px solid #e5e5e5; }
        .stores-table th.may-col, .stores-table td.may-col { border-left: 1px solid #e5e5e5; background: transparent; }
        .may-grade-big { display:inline-flex; align-items:center; justify-content:center; min-width:48px; padding:6px 10px; border-radius:6px; font-weight:800; font-size:22px; line-height:1; }
        .may-grade-big.g-green { background:rgba(45,139,40,0.18); color:#1a5e16; }
        .may-grade-big.g-yellow { background:rgba(255,215,16,0.42); color:#0a0a0a; }
        .may-grade-big.g-red { background:rgba(212,0,0,0.15); color:#a00000; }
        .may-grade-arrow { font-size:11px; margin-left:6px; font-weight:700; vertical-align:1px; }
        .may-grade-arrow.trend-up { color:#1a5e16; }
        .may-grade-arrow.trend-down { color:#D40000; }
        .may-grade-arrow.trend-neutral { color:#94a3b8; }
        .plan-chip { display:inline-block; margin-left:6px; padding:2px 7px; border-radius:4px; background:#0a0a0a; color:#fff !important; font-size:9px; font-weight:800; letter-spacing:0.5px; text-decoration:none !important; vertical-align:1px; }
        .plan-chip:hover { background:#0a0a0a; }

        .stores-table thead .group-label { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; padding: 3px 6px; }
        .group-ib { background: transparent; color: #6b7280; }
        .group-ob { background: transparent; color: #6b7280; }
        .group-ov { background: transparent; color: #6b7280; }

        .stores-table tbody tr { border-bottom: 1px solid #e5e7eb; transition: background 0.1s; }
        .stores-table tbody tr:hover { background: #fafafa; }
        .stores-table tbody tr:last-child { border-bottom: none; }
        .stores-table td { padding: 4px 6px; vertical-align: middle; }

        .store-name { font-weight: 600; color: #0a0a0a; font-size: 12px; white-space: nowrap; text-align: left; }

        .metric-cell { text-align: center; padding: 3px 4px !important; }
        /* Compact view: hide percent bars + their headers and the group label row. Grade cells only. */
        .stores-table.compact td.metric-cell,
        .stores-table.compact th.metric-h,
        .stores-table.compact th.group-label { display: none; }
        .stores-table.compact td.grade-cell { padding: 2px 14px !important; text-align: left; }
        .stores-table.compact th { text-align: left; padding-left: 14px; padding-top:4px; padding-bottom:4px; }
        .stores-table.compact th.left { padding-left: 8px; }
        .stores-table.compact tbody tr td.store-name { padding: 2px 14px !important; }
        .stores-table.compact tbody tr { border-bottom: 1px solid #f0f0f0; }
        .stores-table.compact .may-grade-big { font-size: 16px; padding: 3px 8px; min-width: 34px; }
        .stores-table.compact .thermo { height: 24px; }
        /* Inline numbers — always visible. Hover reveals benchmark gap chip + row tint. */
        .grade-wrap { display: inline-flex; align-items: center; gap: 11px; }
        .grade-peek { display: inline-flex; align-items: center; gap: 11px; white-space: nowrap; }
        .grade-peek .gp-pair { font-size: 11px; color: #6b7280; font-variant-numeric: tabular-nums; letter-spacing: 0.1px; }
        .grade-peek .gp-pair strong { color: #0a0a0a; font-weight: 700; }
        .grade-peek .g { font-size: 9.5px; padding: 1px 4px; margin-left: 2px; }
        .gp-bar { position:relative; display:inline-block; height:5px; background:#f0f0f0; border-radius:3px; opacity:0; width:0; overflow:visible; transition:opacity 0.18s ease-out, width 0.25s ease-out; vertical-align:middle; margin-left:6px; }
        .gp-bar .gp-bar-fill { position:absolute; left:0; top:0; bottom:0; border-radius:3px; }
        .gp-bar .gp-bar-bench { position:absolute; top:-2px; bottom:-2px; width:1.5px; background:#0a0a0a; }
        .stores-table.compact tbody tr:hover .gp-bar { opacity:1; width:54px; }
        .stores-table.compact tbody tr:hover { background: #fafafa; }
        
        /* Compact/Detailed toggle */
        .view-toggle { display:inline-flex; background:#fafafa; border:1px solid #e5e5e5; border-radius:6px; overflow:hidden; }
        .view-toggle button { background:transparent; border:none; color:#6b7280; padding:5px 12px; font-size:11px; font-weight:600; font-family:inherit; cursor:pointer; transition:background 0.15s, color 0.15s; }
        .view-toggle button.active { background:#0a0a0a; color:#fff; }

        /* MINI BAR — metric vs benchmark */
        .mini-bar-wrap {
            position: relative;
            height: 22px;
            background: #fafafa;
            border-radius: 3px;
            overflow: hidden;
            min-width: 70px;
        }

        .mini-bar-fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .mini-bar-benchmark {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: #374151;
            z-index: 2;
        }

        .mini-bar-text {
            position: relative;
            z-index: 3;
            font-size: 11px;
            font-weight: 700;
            line-height: 22px;
            text-align: center;
            color: #0a0a0a;
        }

        .bar-green { background: rgba(45,139,40,0.28); }
        .bar-yellow { background: rgba(255,215,16,0.45); }
        .bar-red { background: rgba(212,0,0,0.22); }

        .mg { font-size: 10px; margin-top: 1px; text-align: center; }

        /* GRADE BADGE */
        .g { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 8px; border-radius: 999px; font-weight: 700; font-size: 11px; letter-spacing: 0.1px; }
        .g::before { content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
        .g-green { background: rgba(45,139,40,0.10); color: #1f6b1a; }
        .g-green::before { background: #2D8B28; }
        .g-yellow { background: rgba(255,215,16,0.30); color: #0a0a0a; }
        .g-yellow::before { background: #FFD710; box-shadow: 0 0 0 1px rgba(0,0,0,0.10); }
        .g-red { background: rgba(212,0,0,0.10); color: #a00000; }
        .g-red::before { background: #D40000; }

        /* Modernize cards: softer borders, subtle elevation, optional hover lift */
        .card-lift { transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), box-shadow 0.18s ease, border-color 0.18s ease; will-change: transform; }
        .card-lift:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04); border-color: #e2e6ea; }

        /* Motion: subtle entry animations + hover responses */
        @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes scaleIn { from { opacity:0; transform: scale(0.92); } to { opacity:1; transform: scale(1); } }
        @keyframes barFill { from { width:0; } }
        @keyframes pulseDot { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.4); opacity:0.7; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .tab-panel.active { animation: fadeUp 0.32s cubic-bezier(0.16,1,0.3,1); }
        .progress-card { animation: fadeUp 0.42s cubic-bezier(0.16,1,0.3,1) both; }
        .progress-card:nth-child(1) { animation-delay: 0.02s; }
        .progress-card:nth-child(2) { animation-delay: 0.10s; }
        .progress-card:nth-child(3) { animation-delay: 0.18s; }
        .pgb-green, .pgb-yellow, .pgb-red { animation: barFill 0.7s cubic-bezier(0.16,1,0.3,1) 0.25s both; }
        .g { animation: scaleIn 0.30s cubic-bezier(0.16,1,0.3,1) both; }
        .g:hover { transform: translateY(-1px) scale(1.03); transition: transform 0.12s ease; }
        .lu-dot { animation: pulseDot 2.4s ease-in-out infinite; }
        .alert-tile.critical { animation: fadeUp 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .alert-tile.critical::before { content:''; position:absolute; top:0; left:0; bottom:0; width:3px; background:#D40000; animation: pulseDot 1.8s ease-in-out infinite; }
        .alert-tile { position:relative; }
        .stores-table tbody tr { animation: fadeIn 0.4s ease-out both; }
        .stores-table tbody tr:nth-child(n+1) { animation-delay: calc((var(--row-i, 0)) * 0.025s); }
        .focus-btn:active { transform: scale(0.96); transition: transform 0.06s; }
        .tab-btn { position: relative; }
        .tab-btn::after { content:''; position:absolute; bottom:-2px; left:50%; right:50%; height:2px; background:#2D8B28; transition: left 0.22s cubic-bezier(0.16,1,0.3,1), right 0.22s cubic-bezier(0.16,1,0.3,1); }
        .tab-btn:hover::after { left:14px; right:14px; }
        .tab-btn.active::after { left:14px; right:14px; }
        .tab-btn.active { border-bottom-color: transparent; }
        /* Respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        /* GRADE THERMOMETER */
        .thermo-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .thermo {
            width: 6px;
            height: 28px;
            background: #e5e7eb;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .thermo-fill {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            border-radius: 3px;
            transition: height 0.3s;
        }

        .thermo-green { background: #2D8B28; }
        .thermo-yellow { background: #FFD710; }
        .thermo-red { background: #D40000; }

        .grade-cell { text-align: center; white-space: nowrap; }

        .trend-arrow { font-size: 10px; font-weight: 700; margin-left: 2px; }
        .trend-up { color: #2D8B28; }
        .trend-down { color: #D40000; }
        .trend-neutral { color: #9ca3af; }
        .arrow-sep { color: #9ca3af; font-size: 10px; margin: 0 1px; }

        /* EXPAND */
        .row-expand-btn {
            background: none; border: none; cursor: pointer;
            font-size: 10px; color: #9ca3af; padding: 2px 4px; border-radius: 3px; font-family: inherit;
        }
        .row-expand-btn:hover { background: #f3f4f6; color: #6b7280; }
        .row-expand-btn.expanded { transform: rotate(180deg); }

        .detail-row { display: none; }
        .detail-row.expanded { display: table-row; }
        .detail-row td { background: #fafafa; padding: 8px; border-top: 1px solid #e5e7eb; }

        .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        .detail-card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; padding: 6px 8px;
        }
        .detail-card .dl { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }

        /* Detail bar chart */
        .detail-bar-row {
            display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11px;
        }
        .detail-bar-label { width: 32px; color: #6b7280; font-weight: 500; flex-shrink: 0; }
        .detail-bar-track {
            flex: 1; height: 14px; background: #fafafa; border-radius: 2px; position: relative; overflow: hidden;
        }
        .detail-bar-fill-inner {
            position: absolute; top: 0; left: 0; bottom: 0; border-radius: 2px;
        }
        .detail-bar-val {
            position: relative; z-index: 2; font-size: 10px; font-weight: 600; line-height: 14px; padding-left: 4px; color: #374151;
        }
        .detail-bar-mark {
            position: absolute; top: 0; bottom: 0; width: 2px; background: #374151; z-index: 3;
        }

        /* PROGRESS VISUAL — compact, 3 cards side-by-side */
        .progress-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 8px 16px 4px; background: #fff; border-bottom: 1px solid #eceef0; }
        .progress-card {
            background: #fff; border: 1px solid #eceef0; border-radius: 10px; padding: 8px 12px;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .progress-card:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(15,23,42,0.05); }
        .progress-card h4 { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 5px; }
        .pc-trend { font-size:10.5px; font-weight:700; color:#0a0a0a; letter-spacing:0; text-transform:none; }
        .pc-trend .trend-arrow { font-size:9px; vertical-align:1px; margin-right:1px; }
        .pc-trend .trend-up { color:#2D8B28; }
        .pc-trend .trend-down { color:#D40000; }
        .pc-trend .trend-neutral { color:#9ca3af; }
        .progress-donut-row { display: flex; align-items: center; gap: 12px; }
        .progress-donut { position: relative; width: 38px; height: 38px; flex-shrink: 0; }
        .progress-donut svg { width: 38px; height: 38px; transform: rotate(-90deg); }
        .progress-donut-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 11px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.3px; }
        .progress-stats { display: flex; flex-direction: column; gap: 1px; font-size: 10.5px; }
        .progress-stats .ps-row { display: flex; align-items: center; gap: 4px; }
        .ps-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .ps-dot-green { background: #2D8B28; }
        .ps-dot-yellow { background: #FFD710; box-shadow: 0 0 0 1px rgba(0,0,0,0.10); }
        .ps-dot-red { background: #D40000; }
        .progress-grade-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 6px; }
        .pgb-green { background: #2D8B28; }
        .pgb-yellow { background: #FFD710; }
        .pgb-red { background: #D40000; }

        /* DETAIL GRADE TREND */
        .detail-grade-trend { display: flex; align-items: center; gap: 3px; margin-top: 2px; }

        /* ALERTS */
        .region-group-header { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 12px 0 6px; margin-top: 18px; color: #6b7280; border-bottom: 1px solid #e5e5e5; }
        .region-group-header:first-child { margin-top: 0; }
        .region-group-header.west-hdr, .region-group-header.east-hdr { background: transparent; color: #6b7280; border-left: none; }
        .alert-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px; margin-bottom: 8px; }
        .alert-tile { padding: 7px 10px; border-radius: 6px; border-left: 3px solid; font-size: 12px; transition: box-shadow 0.15s, transform 0.1s; }
        .alert-tile:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); transform: translateY(-1px); }
        .alert-tile.critical { background: #fff; border-color: #D40000; }
        .alert-tile.high { background: #fff; border-color: #FFD710; }
        .alert-tile.medium { background: #fff; border-color: #6366f1; }
        .alert-tile h4 { font-size: 12px; font-weight: 600; color: #0a0a0a; margin-bottom: 1px; }
        .alert-tile p { color: #6b7280; font-size: 11px; }
        .alert-detail-panel { background: #fafafa; border-radius: 6px; padding: 10px; }

        /* COACHING */
        .coaching-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
        .coaching-card {
            background: #fff; border: 1px solid #fafafa; border-radius: 8px; padding: 12px 14px;
            cursor: pointer; transition: box-shadow 0.15s, transform 0.1s;
        }
        .coaching-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); transform: translateY(-1px); }
        .coaching-card-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .coaching-card-hdr h4 { font-size: 13px; font-weight: 700; color: #0a0a0a; margin: 0; }
        .coaching-card-hdr .cc-grade { font-size: 16px; font-weight: 800; }
        .coaching-card-hdr .cc-arrow { font-size: 10px; margin-left: 2px; }
        .cc-issues { display: flex; flex-direction: column; gap: 5px; }
        .cc-issue { display: flex; align-items: center; gap: 8px; font-size: 12px; }

            return{ib:s2g(iS),ob:s2g(oS),ov:s2g(ovS),iS,oS,ovS,rg,sg,lg,ag};
        }

        // Dynamic month indices: last locked month + current MTD month (auto-shifts each month).
        const _PMI = TRENDS.months.length - 2;     // previous (last locked) month index
        const _CMI = TRENDS.months.length - 1;     // current MTD month index
        const PREV_MO = TRENDS.months[_PMI];       // e.g. 'Apr' today, 'May' next month
        const CUR_MO  = TRENDS.months[_CMI];       // e.g. 'May' today, 'Jun' next month
        // Compute lastMonth / currentMTD aliases and (legacy) March / Apr / May fields from TRENDS arrays
        D.stores.forEach(s=>{
            const ri=TRENDS.ri[s.id], st=TRENDS.set[s.id];
            const lv=OB_TRENDS.live[s.id], ap=OB_TRENDS.appt[s.id];
            // May = index 4 (current MTD partial)
            s.may = {
                req: ri&&ri[4]!=null ? ri[4] : s.current.req,
                set: st&&st[4]!=null ? st[4] : s.current.set,
                live: lv&&lv[4]!=null ? lv[4] : s.current.live,
                appt: ap&&ap[4]!=null ? ap[4] : s.current.appt
            };
            // Dynamic alias: lastMonth = previous locked month (PREV_MO)
            s.lastMonth = {
                req: ri&&ri[_PMI]!=null ? ri[_PMI] : s.current.req,
                set: st&&st[_PMI]!=null ? st[_PMI] : s.current.set,
                live: lv&&lv[_PMI]!=null ? lv[_PMI] : s.current.live,
                appt: ap&&ap[_PMI]!=null ? ap[_PMI] : s.current.appt
            };
            // April = index 3 (locked)
            s.april = {
                req: ri&&ri[3]!=null ? ri[3] : s.current.req,
                set: st&&st[3]!=null ? st[3] : s.current.set,
                live: lv&&lv[3]!=null ? lv[3] : s.current.live,
                appt: ap&&ap[3]!=null ? ap[3] : s.current.appt
            };
            // Recompute YTD as average of all available months in TRENDS
            function avg(arr){ if(!arr) return null; const v=arr.filter(x=>x!=null); return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null; }
            const ytdReq=avg(ri), ytdSet=avg(st), ytdLive=avg(lv), ytdAppt=avg(ap);
            s.ytd = {
                req: ytdReq!=null ? ytdReq : s.ytd.req,
                set: ytdSet!=null ? ytdSet : s.ytd.set,
                live: ytdLive!=null ? ytdLive : s.ytd.live,
                appt: ytdAppt!=null ? ytdAppt : s.ytd.appt
            };
        });

        function gColor(g){const n=gn(g);if(n>=3.3)return'green';if(n>=1.7)return'yellow';return'red';}
        function gc(g){return'g-'+gColor(g);}

        // Find the single most efficient metric move to push overall GPA >= targetS, using the grade scale.
        // Returns {key,label,fromPct,toPct,fromGrade,toGrade,steps,pp} or null if no single metric gets there.
        const METRIC_LABELS = { req:'RI%', set:'Set%', live:'Live%', appt:'Appt%' };
        function pathToGrade(cur, targetS){
            const idxOf = (k,grade)=> GS[k].findIndex(s=>s.g===grade);
            let best = null;
            for(const k of ['req','set','live','appt']){
                const curVal = cur[k], curGrade = gg(curVal,k);
                const bands = [...GS[k]].reverse(); // ascending by threshold
                for(const band of bands){
                    if(band.m <= curVal) continue;            // only higher bands
                    const trial = {...cur, [k]: band.m};
                    if(calc(trial).ovS >= targetS - 1e-9){
                        const steps = idxOf(k,curGrade) - idxOf(k,band.g);
                        const cand = { key:k, label:METRIC_LABELS[k], fromPct:curVal, toPct:band.m,
                                       fromGrade:curGrade, toGrade:band.g, steps, pp:+(band.m-curVal).toFixed(1) };
                        // prefer fewest grade-steps, then weakest current lever (lowest GPA), then smallest pp
                        const better = !best || cand.steps<best.steps ||
                            (cand.steps===best.steps && gn(cand.fromGrade)<gn(best.fromGrade)) ||
                            (cand.steps===best.steps && gn(cand.fromGrade)===gn(best.fromGrade) && cand.pp<best.pp);
                        if(better) best = cand;
                        break; // first (smallest) qualifying band for this metric
                    }
                }
            }
            return best;
        }
        function barC(g){return'bar-'+gColor(g);}
        function thermoC(g){return'thermo-'+gColor(g);}
        function sn(n){return n.replace('Fred Anderson ','').replace('Genesis of ','Genesis ').replace('Toyota of Cape Coral','Cape Coral');}

        // GPA to percentage for thermometer (0-4 → 0-100%)
        function gpaPercent(grade){ return Math.min(100, (gn(grade)/4)*100); }

        // Mini bar HTML
        function miniBar(val, metric, grade) {
            const pct = Math.min(100, (val / MAXV[metric]) * 100);
            const benchPct = (BENCH[metric] / MAXV[metric]) * 100;
            return `<div class="mini-bar-wrap">
                <div class="mini-bar-fill ${barC(grade)}" style="width:${pct}%"></div>
                <div class="mini-bar-benchmark" style="left:${benchPct}%" title="Benchmark: ${BENCH[metric]}%"></div>
                <div class="mini-bar-text">${val}% <span class="g ${gc(grade)}" style="font-size:9px;padding:0 3px;margin-left:2px;">${grade}</span></div>
            </div>`;
        }

        // Thermometer HTML
        function thermo(grade) {
            const pct = gpaPercent(grade);
            return `<div class="thermo-wrap">
                <div class="thermo" style="height:36px;"><div class="thermo-fill ${thermoC(grade)}" style="height:${pct}%"></div></div>
                <span class="g ${gc(grade)}" style="font-size:18px;padding:3px 9px;border-radius:5px;">${grade}</span>
            </div>`;
        }

        // Detail bar chart row
        function detailBar(label, ytdVal, marVal, curVal, metric, storeId) {
            const ytdGrade = gg(ytdVal, metric);
            const marGrade = gg(marVal, metric);
            const curGrade = gg(curVal, metric);
            const maxV = MAXV[metric];
            const benchPct = (BENCH[metric]/maxV)*100;
            const ytdPct = Math.min(100,(ytdVal/maxV)*100);
            const marPct = Math.min(100,(marVal/maxV)*100);
            const curPct = Math.min(100,(curVal/maxV)*100);
            const clickAttr = storeId ? ` class="staff-apr-click" onclick="event.stopPropagation();showStaffModal('${storeId}')" title="Click to see per-salesperson breakdown"` : '';
            return `
                <div class="detail-bar-row">
                    <span class="detail-bar-label">YTD</span>
                    <div class="detail-bar-track">
                        <div class="detail-bar-fill-inner ${barC(ytdGrade)}" style="width:${ytdPct}%"></div>
                        <div class="detail-bar-mark" style="left:${benchPct}%"></div>
                        <div class="detail-bar-val">${ytdVal}% <span class="g ${gc(ytdGrade)}">${ytdGrade}</span></div>
                    </div>
                </div>
                <div class="detail-bar-row">
                    <span class="detail-bar-label">${PREV_MO}</span>
                    <div class="detail-bar-track">
                        <div class="detail-bar-fill-inner ${barC(marGrade)}" style="width:${marPct}%"></div>
                        <div class="detail-bar-mark" style="left:${benchPct}%"></div>
                        <div class="detail-bar-val">${marVal}% <span class="g ${gc(marGrade)}">${marGrade}</span></div>
                    </div>
                </div>
                <div class="detail-bar-row"${clickAttr}>
                    <span class="detail-bar-label">${CUR_MO}</span>
                    <div class="detail-bar-track">
                        <div class="detail-bar-fill-inner ${barC(curGrade)}" style="width:${curPct}%"></div>
                        <div class="detail-bar-mark" style="left:${benchPct}%"></div>
                        <div class="detail-bar-val">${curVal}% <span class="g ${gc(curGrade)}">${curGrade}</span></div>
                    </div>
                </div>`;
        }

        function switchTab(tab,btn){
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
            document.getElementById('panel-'+tab).classList.add('active');
            btn.classList.add('active');
            // Redraw charts when their tab becomes visible (canvas needs non-zero dimensions)
            if(tab==='trends') setTimeout(drawTrendChart,50);
            if(tab==='obtrends') setTimeout(drawOBTrendChart,50);
            if(tab==='baseline') setTimeout(drawCombinedTrendChart,50);
        }

        // ============================================
        // STORES
        // ============================================
        // Sort state per region
        const sortState={West:{col:'ov',asc:false},East:{col:'ov',asc:false}};
        function sortKey(store,col){
            const c=calc(store.current);
            if(col==='req')return store.current.req;if(col==='set')return store.current.set;
            if(col==='live')return store.current.live;if(col==='appt')return store.current.appt;
            if(col==='ib')return c.iS;if(col==='ob')return c.oS;if(col==='ov')return c.ovS;
            if(col==='store')return store.id;return 0;
        }
        function toggleSort(region,col){
            const s=sortState[region];
            if(s.col===col){s.asc=!s.asc;}else{s.col=col;s.asc=true;}
            renderStores();
        }
        function sortStores(stores,region){
            const s=sortState[region];
            if(!s.col)return stores;
            const sorted=[...stores].sort((a,b)=>{
                const av=sortKey(a,s.col),bv=sortKey(b,s.col);
                if(typeof av==='string')return s.asc?av.localeCompare(bv):bv.localeCompare(av);
                return s.asc?av-bv:bv-av;
            });
            return sorted;
        }
        function sortArrow(region,col){
            const s=sortState[region];
            if(s.col!==col)return'<span class="sort-arrow">&#9650;&#9660;</span>';
            return s.asc?'<span class="sort-arrow active">&#9650;</span>':'<span class="sort-arrow active">&#9660;</span>';
        }

        // Donut SVG helper — segments drawn sequentially around the circle
        function donutSVG(pctGreen, pctYellow, pctRed) {
            const r=22, circ=2*Math.PI*r;
            const gLen=circ*pctGreen/100, yLen=circ*pctYellow/100, rLen=circ*pctRed/100;
            // stroke-dashoffset shifts the start point backwards; negative = clockwise advance
            // With rotate(-90deg), 0 offset = 12 o'clock. Each segment starts after the previous.
            const gOff=0;
            const yOff=-(gLen);
            const rOff=-(gLen+yLen);
            return `<svg viewBox="0 0 56 56">
                <circle cx="28" cy="28" r="${r}" fill="none" stroke="#fafafa" stroke-width="8"/>
                ${gLen>0?`<circle cx="28" cy="28" r="${r}" fill="none" stroke="#2D8B28" stroke-opacity="0.6" stroke-width="8" stroke-dasharray="${gLen} ${circ-gLen}" stroke-dashoffset="${gOff}"/>`:''}
                ${yLen>0?`<circle cx="28" cy="28" r="${r}" fill="none" stroke="#FFD710" stroke-opacity="0.7" stroke-width="8" stroke-dasharray="${yLen} ${circ-yLen}" stroke-dashoffset="${yOff}"/>`:''}
                ${rLen>0?`<circle cx="28" cy="28" r="${r}" fill="none" stroke="#D40000" stroke-opacity="0.55" stroke-width="8" stroke-dasharray="${rLen} ${circ-rLen}" stroke-dashoffset="${rOff}"/>`:''}
            </svg>`;
        }

        function scrollToRegion(target){
            const el = document.getElementById(target);
            if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
        }
        function progressCard(title, stores, borderColor, scrollTarget) {
            let green=0,yellow=0,red=0,improved=0,declined=0,steady=0;
            stores.forEach(s=>{
                const c=calc(s.current), m=calc(s.lastMonth);
                const col=gColor(c.ov);
                if(col==='green')green++;else if(col==='yellow')yellow++;else red++;
                const cg=gn(c.ov),mg=gn(m.ov);
                if(cg>mg)improved++;else if(cg<mg)declined++;else steady++;
            });
            const n=stores.length;
            const pG=(green/n*100),pY=(yellow/n*100),pR=(red/n*100);
            const avgOv=stores.map(s=>calc(s.current).ovS).reduce((a,b)=>a+b,0)/n;
            const clickAttr = scrollTarget ? ` onclick="scrollToRegion('${scrollTarget}')" style="border-top:3px solid ${borderColor};cursor:pointer;" title="Jump to ${title}"` : ` style="border-top:3px solid ${borderColor};"`;
            return `<div class="progress-card"${clickAttr}>
                <h4 style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
                    <span>${title}</span>
                    <span class="pc-trend">
                        <span class="trend-arrow trend-up">&#9650;</span>${improved}
                        <span class="trend-arrow trend-down" style="margin-left:6px;">&#9660;</span>${declined}
                        <span class="trend-arrow trend-neutral" style="margin-left:6px;">&mdash;</span>${steady}
                    </span>
                </h4>
                <div class="progress-donut-row">
                    <div class="progress-donut">${donutSVG(pG,pY,pR)}<div class="progress-donut-label">${s2g(avgOv)}</div></div>
                    <div class="progress-stats">
                        <div class="ps-row"><span class="ps-dot ps-dot-green"></span><strong>${green}</strong> green (A/A-/B+)</div>
                        <div class="ps-row"><span class="ps-dot ps-dot-yellow"></span><strong>${yellow}</strong> yellow (B–C)</div>
                        <div class="ps-row"><span class="ps-dot ps-dot-red"></span><strong>${red}</strong> red (C- &amp; below)</div>
                    </div>
                </div>
                <div class="progress-grade-bar">
                    <div class="pgb-green" style="width:${pG}%"></div>
                    <div class="pgb-yellow" style="width:${pY}%"></div>
                    <div class="pgb-red" style="width:${pR}%"></div>
                </div>
            </div>`;
        }

        if(typeof window.compactStores==='undefined') window.compactStores = true;
        function setStoresView(compact){ window.compactStores = compact; renderStores(); }
        function renderStores(){
            const el=document.getElementById('storesRegions');
            const west=D.stores.filter(s=>s.region==='West'), east=D.stores.filter(s=>s.region==='East');
            const strip=`<div class="progress-strip">
                ${progressCard('All 17 Stores', D.stores, '#374151', 'region-west')}
                ${progressCard('West Region', west, '#0a0a0a', 'region-west')}
                ${progressCard('East Region', east, '#1a5e16', 'region-east')}
            </div>`;
            const cm = window.compactStores!==false;
            const toggle = `<div class="view-toggle">
                <button class="${cm?'active':''}" onclick="setStoresView(true)">Glance</button>
                <button class="${!cm?'active':''}" onclick="setStoresView(false)">Detailed</button>
            </div>`;
            el.innerHTML=strip+regionTable(west,'West','west',toggle)+regionTable(east,'East','east','');
        }

        function regionTable(stores,label,cls,extraRight){
            const n=stores.length;
            const avgOv=stores.map(s=>calc(s.current).ovS).reduce((a,b)=>a+b,0)/n;
            const avgReq=(stores.map(s=>s.current.req).reduce((a,b)=>a+b,0)/n).toFixed(1);
            const avgSet=(stores.map(s=>s.current.set).reduce((a,b)=>a+b,0)/n).toFixed(1);
            const avgLive=(stores.map(s=>s.current.live).reduce((a,b)=>a+b,0)/n).toFixed(1);
            const avgAppt=(stores.map(s=>s.current.appt).reduce((a,b)=>a+b,0)/n).toFixed(1);

            let h=`<div class="region-section" id="region-${cls}" style="scroll-margin-top:12px;">

                        <span>Live: <strong>${avgLive}%</strong></span>

                </div>
            </div>
            <table class="stores-table ${window.compactStores!==false?'compact':''}"><thead>
                <tr>
                    <th rowspan="2" style="width:22px;"></th>

                    <th colspan="3" class="group-label group-ib ib-start">Inbound (CRISP)</th>

                <tr>
                    <th class="ib-start sortable metric-h" onclick="toggleSort('${label}','req')">RI %${sortArrow(label,'req')}</th>
                    <th class="sortable metric-h" onclick="toggleSort('${label}','set')">Set %${sortArrow(label,'set')}</th>
                    <th class="sortable ib-start" onclick="toggleSort('${label}','ib')">Inbound${sortArrow(label,'ib')}</th>

                    <th class="sortable ob-start" onclick="toggleSort('${label}','ob')">Outbound${sortArrow(label,'ob')}</th>
                </tr>
            </thead><tbody>`;

            const sorted=sortStores(stores,label);
            sorted.forEach(store=>{
                const c=calc(store.current), m=calc(store.lastMonth), y=calc(store.ytd), may=calc(store.may), apr=calc(store.april);
                // Leftmost pill = CURRENT month (CUR_MO) overall grade.
                // Arrow = current vs lastMonth (PREV_MO).
                const curGpa=gn(c.ov),prevGpa=gn(m.ov);

                const idx=D.stores.indexOf(store);

                h+=`<tr>
                    <td><button class="row-expand-btn" onclick="toggleDetail(${idx},event)">&#9660;</button></td>
                    <td class="store-name" title="${store.name}">
                        <div style="display:flex;align-items:center;gap:11px;">
                            <span class="may-grade-big ${gc(c.ov)}">${c.ov}</span>

                            <span><a href="#" onclick="event.preventDefault();event.stopPropagation();showOnePager('${store.id}')" style="color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;font-weight:800;font-size:18px;letter-spacing:0.3px;">${store.id}</a></span>
                        </div>
                    </td>
                    <td class="metric-cell ib-start">${miniBar(store.current.req,'req',c.rg)}</td>
                    <td class="metric-cell">${miniBar(store.current.set,'set',c.sg)}</td>
                    <td class="grade-cell"><div class="grade-wrap">${thermo(c.ib)}<span class="grade-peek"><span class="gp-pair">RI <strong>${store.current.req}%</strong> <span class="g ${gc(c.rg)}">${c.rg}</span><span class="gp-bar"><span class="gp-bar-fill ${barC(c.rg)}" style="width:${Math.min(100, store.current.req/(BENCH.req*1.2)*100)}%;"></span><span class="gp-bar-bench" style="left:83.33%;"></span></span></span><span class="gp-pair">Set <strong>${store.current.set}%</strong> <span class="g ${gc(c.sg)}">${c.sg}</span><span class="gp-bar"><span class="gp-bar-fill ${barC(c.sg)}" style="width:${Math.min(100, store.current.set/(BENCH.set*1.2)*100)}%;"></span><span class="gp-bar-bench" style="left:83.33%;"></span></span></span></span></div></td>
                    <td class="metric-cell ob-start">${miniBar(store.current.live,'live',c.lg)}</td>
                    <td class="metric-cell">${miniBar(store.current.appt,'appt',c.ag)}</td>
                    <td class="grade-cell"><div class="grade-wrap">${thermo(c.ob)}<span class="grade-peek"><span class="gp-pair">Live <strong>${store.current.live}%</strong> <span class="g ${gc(c.lg)}">${c.lg}</span><span class="gp-bar"><span class="gp-bar-fill ${barC(c.lg)}" style="width:${Math.min(100, store.current.live/(BENCH.live*1.2)*100)}%;"></span><span class="gp-bar-bench" style="left:83.33%;"></span></span></span><span class="gp-pair">Appt <strong>${store.current.appt}%</strong> <span class="g ${gc(c.ag)}">${c.ag}</span><span class="gp-bar"><span class="gp-bar-fill ${barC(c.ag)}" style="width:${Math.min(100, store.current.appt/(BENCH.appt*1.2)*100)}%;"></span><span class="gp-bar-bench" style="left:83.33%;"></span></span></span></span></div></td>
                </tr>
                <tr class="detail-row" id="detail-${idx}"><td colspan="8">
                    <div style="font-size:11px;color:#6b7280;margin-bottom:4px;font-weight:600;">${store.name}</div>
                    <div class="detail-grid">
                        <div class="detail-card"><div class="dl">Request In % <span style="color:#9ca3af;">bench: ${BENCH.req}%</span></div>${detailBar('',store.ytd.req,store.may.req,store.current.req,'req')}</div>
                        <div class="detail-card"><div class="dl">Set % <span style="color:#9ca3af;">bench: ${BENCH.set}%</span></div>${detailBar('',store.ytd.set,store.may.set,store.current.set,'set')}</div>
                        <div class="detail-card"><div class="dl">Inbound Grade</div>
                            <div class="detail-bar-row"><span class="detail-bar-label">YTD</span><span class="g ${gc(y.ib)}">${y.ib}</span></div>
                            <div class="detail-bar-row"><span class="detail-bar-label">${PREV_MO}</span><span class="g ${gc(may.ib)}">${may.ib}</span></div>

                            </div>
                        </div>
                        <div class="detail-card"><div class="dl">Live Convos % <span style="color:#9ca3af;">bench: ${BENCH.live}%</span></div>${detailBar('',store.ytd.live,store.may.live,store.current.live,'live',store.id)}</div>
                        <div class="detail-card"><div class="dl">Appt Set % <span style="color:#9ca3af;">bench: ${BENCH.appt}%</span></div>${detailBar('',store.ytd.appt,store.may.appt,store.current.appt,'appt',store.id)}</div>
                        <div class="detail-card"><div class="dl">Outbound Grade</div>
                            <div class="detail-bar-row"><span class="detail-bar-label">YTD</span><span class="g ${gc(y.ob)}">${y.ob}</span></div>

        function getAlertsForStores(stores){
            const alerts=[];
            stores.filter(s=>s.id!=='TCC').forEach(store=>{
                const c=calc(store.current),m=calc(store.lastMonth),name=store.id;
                if(gn(c.ov)<gn(m.ov)) alerts.push({sev:'critical',sid:store.id,type:'declined',title:name+' DECLINED',desc:'Overall '+m.ov+' → '+c.ov+' ('+PREV_MO+' → '+CUR_MO+'). Immediate coaching needed.'});
                const fails=[];
                if(c.rg==='F'||c.rg==='D') fails.push('RI: '+store.current.req+'% ('+c.rg+')');
                if(c.sg==='F'||c.sg==='D') fails.push('Set: '+store.current.set+'% ('+c.sg+')');
                if(c.lg==='F'||c.lg==='D') fails.push('Live: '+store.current.live+'% ('+c.lg+')');
                if(c.ag==='F'||c.ag==='D') fails.push('Appt: '+store.current.appt+'% ('+c.ag+')');
                if(fails.length>0&&gn(c.ov)>=gn(m.ov)) alerts.push({sev:'high',sid:store.id,type:'critical',title:name+' — Critical Metrics',desc:fails.join(', ')});
                const mrg=gg(store.lastMonth.req,'req'),msg=gg(store.lastMonth.set,'set');
                if((gn(c.rg)<gn(mrg)||gn(c.sg)<gn(msg))&&gn(c.ov)>=gn(m.ov)&&fails.length===0)
                    alerts.push({sev:'medium',sid:store.id,type:'inbound',title:name+' — Inbound Decline',desc:'Inbound slipped from '+PREV_MO+' despite overall holding. Watch RI & Set.'});
            });
            return alerts;
        }

        function drawAlertMiniChart(canvasId, series1, series2, label1, label2, color1, color2, months) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if(w===0||h===0) return;
            canvas.width = w * dpr; canvas.height = h * dpr;
            ctx.scale(dpr, dpr);

            const vals1 = series1 || [];
            const vals2 = series2 || [];
            const pad = {top:28, right:30, bottom:22, left:34};
            const cw = w - pad.left - pad.right;
            const ch = h - pad.top - pad.bottom;

            // Y range
            const allVals = [...vals1,...vals2].filter(v=>v!==null);
            if(!allVals.length) { ctx.fillStyle='#9ca3af';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('No trend data',w/2,h/2);return; }
            let minV = Math.floor(Math.min(...allVals)/5)*5 - 3;
            let maxV = Math.ceil(Math.max(...allVals)/5)*5 + 5;
            if(minV<0) minV=0;

            const xStep = months.length>1 ? cw / (months.length - 1) : cw;
            const yScale = ch / (maxV - minV);
            const toX = i => pad.left + i * xStep;
            const toY = v => pad.top + (maxV - v) * yScale;

            // Background
            ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);

            // Grid
            ctx.strokeStyle = '#fafafa'; ctx.lineWidth = 1;
            for(let v = Math.ceil(minV/10)*10; v <= maxV; v += 10) {
                const y = toY(v);
                ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w-pad.right, y); ctx.stroke();
                ctx.fillStyle = '#94a3b8'; ctx.font = '9px -apple-system, sans-serif'; ctx.textAlign = 'right';
                ctx.fillText(v+'%', pad.left - 5, y + 3);
            }

            // Month labels
            ctx.fillStyle = '#94a3b8'; ctx.font = '9px -apple-system, sans-serif'; ctx.textAlign = 'center';
            months.forEach((mo,i) => ctx.fillText(mo, toX(i), h - 5));

            // Collect label positions to avoid overlap
            const labels = [];

            // Draw line helper
            function drawMiniLine(vals, color, seriesIdx) {
                if(!vals||!vals.length) return;
                ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.setLineDash([]);
                ctx.beginPath();
                let started = false;
                vals.forEach((v,i) => {
                    if(v===null) return;
                    const x = toX(i), y = toY(v);
                    if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
                });
                ctx.stroke();
                vals.forEach((v,i) => {
                    if(v===null) return;
                    const x = toX(i), y = toY(v);
                    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
                    ctx.fillStyle='#fff'; ctx.fill();
                    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
                    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
                    // Store label position
                    labels.push({x, y:y-9, text:v+'%', color, seriesIdx, monthIdx:i});
                });
            }

            drawMiniLine(vals1, color1, 0);
            drawMiniLine(vals2, color2, 1);

            // Resolve overlapping labels — nudge apart vertically
            labels.sort((a,b) => a.monthIdx - b.monthIdx || a.y - b.y);
            for(let i=0;i<labels.length;i++){
                for(let j=i+1;j<labels.length;j++){
                    if(labels[i].monthIdx===labels[j].monthIdx && Math.abs(labels[i].y - labels[j].y)<11){
                        labels[i].y -= 6;
                        labels[j].y += 6;
                    }
                }
            }

            // Draw labels
            labels.forEach(l => {
                ctx.fillStyle = l.color; ctx.font = 'bold 9px -apple-system, sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(l.text, l.x, l.y);
            });

            // Legend — centered at top
            ctx.font = 'bold 10px -apple-system, sans-serif';
            const legendW = ctx.measureText(label1).width + ctx.measureText(label2).width + 44;
            const lx = (w - legendW) / 2;
            ctx.fillStyle = color1;
            ctx.beginPath(); ctx.arc(lx+4, 8, 4, 0, Math.PI*2); ctx.fill();
            ctx.textAlign = 'left';
            ctx.fillText(label1, lx+12, 11);
            const l2x = lx + ctx.measureText(label1).width + 28;
            ctx.fillStyle = color2;
            ctx.beginPath(); ctx.arc(l2x+4, 8, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText(label2, l2x+12, 11);
        }

        function renderAlerts(){
            // Bucket every store by severity. Severity = how close to / how far below the B− line.
            const all = D.stores.filter(s=>s.id!=='TCC').map(s=>{
                const c = calc(s.current), lm = calc(s.lastMonth);
                const dropOv = gn(lm.ov) - gn(c.ov);   // positive = declined since last month
                return { s, c, lm, dropOv };
            });
            // Travel = ovS < 2.3 (below B-)
            const travel = all.filter(x => x.c.ovS < 2.3).sort((a,b)=>a.c.ovS - b.c.ovS);
            // On-bubble = ovS in [2.3, 2.7] (sitting at B-)
            const bubble = all.filter(x => x.c.ovS >= 2.3 && x.c.ovS < 2.7).sort((a,b)=>a.c.ovS - b.c.ovS);
            // Watchers = solid B/B+ but declined materially since last month

                return;
            }

            // Hero = worst store still below the line (if any), else worst on bubble
            const hero = travel[0] || bubble[0];
            // Next grade rung up from hero's current ovS
            const RUNGS = [0.7,1.0,1.3,1.7,2.0,2.3,2.7,3.0,3.3,3.7];
            const heroNext = RUNGS.find(t=>t>hero.c.ovS+1e-9);

                : `Inbound is the gap on both sides &mdash; pull the rep coaching list and work RI and Set together.`;

                    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">
                        <div style="display:flex;align-items:baseline;gap:14px;">
                            <span style="font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#a00000;font-weight:700;">Top Priority</span>
                            <span style="font-size:11px;color:#6b7280;">${hero.c.ovS<2.3?'Lowest overall grade — biggest lift available':'Stuck at this rung — one move up moves the team'}</span>
                        </div>
                        <span class="g ${gc(hero.c.ov)}" style="font-size:14px;padding:4px 10px;">${hero.c.ov}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:18px;cursor:pointer;" onclick="showOnePager('${hero.s.id}')">
                        <span style="font-size:36px;font-weight:800;color:#0a0a0a;letter-spacing:-0.5px;">${hero.s.id}</span>
                        <span style="font-size:14px;color:#6b7280;">${hero.s.name.replace('Fred Anderson ','').replace('Genesis of ','Genesis ')}</span>
                    </div>
                    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f0;font-size:13.5px;color:#0a0a0a;line-height:1.55;">${heroAction}</div>
                </div>`;

            // Compact list of all remaining alerts (rest of travel + bubble + watchers), grouped by region
            const rest = [...travel.slice(1), ...bubble, ...watchers];
            const sevTag = x => x.c.ovS<2.3 ? {label:'Lowest Grades', color:'#a00000'} : x.c.ovS<2.7 ? {label:'Borderline', color:'#0a0a0a'} : {label:'Slipping', color:'#0a0a0a'};
            const rowFn = x => {
                const t = sevTag(x);
                const delta = x.dropOv>0 ? `<span style="color:#a00000;font-weight:700;">&minus;${x.dropOv.toFixed(2)} vs ${PREV_MO}</span>` : '';
                return `<div onclick="showOnePager('${x.s.id}')" style="display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.1s;" onmouseover="this.style.background='#fafafa';" onmouseout="this.style.background='#fff';">
                    <span style="font-size:9px;letter-spacing:0.8px;text-transform:uppercase;font-weight:700;color:${t.color};min-width:74px;">${t.label}</span>

            const regionHeader = (label, count, color) => `<div style="padding:10px 18px;background:#fafafa;border-bottom:1px solid #f0f0f0;display:flex;align-items:baseline;gap:10px;"><span style="font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:${color};">${label}</span><span style="font-size:11px;color:#6b7280;">${count} store${count===1?'':'s'}</span></div>`;
            const rowHTML = [

        }

        // ============================================
        // COACHING
        // ============================================
        function getCoachingForStores(stores){
            const cards=[];
            stores.filter(s=>s.id!=='TCC').forEach(store=>{
                const c=calc(store.current),m=calc(store.lastMonth);
                const issues=[];
                // Inbound issues
                if(c.rg==='F'||c.rg==='D') issues.push({tag:'ib',metric:'RI %',val:store.current.req+'%',grade:c.rg});
                else if((c.rg==='C'||c.rg==='C-')&&gn(c.rg)<gn(gg(store.lastMonth.req,'req'))) issues.push({tag:'ib',metric:'RI %',val:store.current.req+'%',grade:c.rg});
                if(c.sg==='F'||c.sg==='D') issues.push({tag:'ib',metric:'Set %',val:store.current.set+'%',grade:c.sg});
                else if((c.sg==='C'||c.sg==='C-')&&gn(c.sg)<gn(gg(store.lastMonth.set,'set'))) issues.push({tag:'ib',metric:'Set %',val:store.current.set+'%',grade:c.sg});
                // Outbound issues
                if(c.lg==='F'||c.lg==='D') issues.push({tag:'ob',metric:'Live %',val:store.current.live+'%',grade:c.lg});
                if(c.ag==='F'||c.ag==='D') issues.push({tag:'ob',metric:'Appt %',val:store.current.appt+'%',grade:c.ag});
                if(issues.length>0){
                    cards.push({sid:store.id,name:store.name,ovGrade:c.ov,ovS:calc(store.current).ovS,issues:issues});
                }
            });
            // Sort worst overall first
            cards.sort((a,b)=>a.ovS-b.ovS);
            return cards.slice(0,3);
        }
        // Auto-pick the single most coachable inbound rep at a store (highest leverage, ≥8 calls, manager-excluded).
        function topInboundRepFor(storeId){
            const ib = (typeof INBOUND_STAFF !== 'undefined') ? (INBOUND_STAFF[storeId] || []) : [];
            const ranked = ib.map(r=>{
                const askPct = r.ib>0 ? Math.round((r.asked/r.ib)*100) : 0;
                const setPct = r.ib>0 ? Math.round((r.booked/r.ib)*100) : 0;
                const askShort = Math.max(0,80-askPct), setShort = Math.max(0,45-setPct);
                return {...r, askPct, setPct, leverage: r.ib*(askShort+setShort)};
            }).filter(r=>r.ib>=8 && (r.askPct<70||r.setPct<40)).sort((a,b)=>b.leverage-a.leverage);
            return ranked[0] || null;
        }
        function renderCoaching(){
            // Rank every store by overall ovS (worst first), keep the bottom 5 — the real coaching pool.
            const pool = D.stores.filter(s=>s.id!=='TCC').map(s=>{
                const c = calc(s.current);
                const path = pathToGrade(s.current, 2.3);
                const rep = topInboundRepFor(s.id);
                return {s, c, path, rep};
            }).sort((a,b)=>a.c.ovS - b.c.ovS).slice(0,5);

            const p = document.getElementById('coachingPanel');
            if(!pool.length){
                p.innerHTML='<div style="padding:48px 24px;text-align:center;font-family:Helvetica,Arial,sans-serif;"><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#2D8B28;font-weight:700;margin-bottom:6px;">All clear</div><div style="font-size:18px;color:#0a0a0a;">No coaching actions needed today.</div></div>';
                return;
            }
            const fp = v => (Math.round(v*10)/10).toString();

            // Hero = worst store
            const hero = pool[0];
            const heroPathText = hero.path && hero.path.steps<=2
                ? `Lift <strong>${hero.path.label}</strong> ${fp(hero.path.fromPct)}% &rarr; ${fp(hero.path.toPct)}% (${hero.path.fromGrade} &rarr; ${hero.path.toGrade}) and ${hero.s.id} clears the B&minus; line.`
                : `${hero.s.id} needs RI and Set moving together. Work both off the rep list to lift one grade.`;
            const heroRepText = hero.rep
                ? `Coach <strong>${hero.rep.n}</strong> (${hero.rep.ib} calls, ${hero.rep.askPct}% ask, ${hero.rep.setPct}% set). Pull 3 of their answered calls and mark exactly where they should have said &ldquo;let&rsquo;s get you in to see it.&rdquo;`
                : `No standout rep flagged &mdash; coaching is a whole-team conversation.`;

            const heroBlock = `
                <div style="background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:24px 26px 22px;margin-bottom:18px;">

        function countUp(el, target, dur=900){
